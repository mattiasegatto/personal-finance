name: Supabase database verification

on:
  push:
    branches:
      - migration/standalone-stack
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  database:
    name: Rebuild database and verify RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Resolve local database container
        run: echo "SUPABASE_DB_CONTAINER=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)" >> "$GITHUB_ENV"

      - name: Rebuild database from migrations
        run: supabase db reset

      - name: Run space and membership isolation tests
        run: |
          docker exec -i "$SUPABASE_DB_CONTAINER" psql --username postgres --dbname postgres --set ON_ERROR_STOP=1 < supabase/tests/rls_isolation.sql

      - name: Run personal finance isolation tests
        shell: bash
        run: |
          set +e
          output=$(docker exec -i "$SUPABASE_DB_CONTAINER" psql --username postgres --dbname postgres --set ON_ERROR_STOP=0 < supabase/tests/finance_isolation.sql 2>&1)
          status=$?
          set -e
          printf '%s\\n' "$output"
          if ! grep -q 'ALL_PASSED:' <<< "$output"; then
            echo "Finance isolation checks did not reach their expected success marker (psql exit: $status)."
            exit 1
          fi

      - name: Run transfer integrity and isolation tests
        shell: bash
        run: |
          set +e
          output=$(docker exec -i "$SUPABASE_DB_CONTAINER" psql --username postgres --dbname postgres --set ON_ERROR_STOP=0 < supabase/tests/transfers.sql 2>&1)
          status=$?
          set -e
          printf '%s\\n' "$output"
          if ! grep -q 'ALL_PASSED:' <<< "$output"; then
            echo "Transfer checks did not reach their expected success marker (psql exit: $status)."
            exit 1
          fi

      - name: Run shared expenses integrity and isolation tests
        shell: bash
        run: |
          set +e
          output=$(docker exec -i "$SUPABASE_DB_CONTAINER" psql --username postgres --dbname postgres --set ON_ERROR_STOP=0 < supabase/tests/shared_expenses.sql 2>&1)
          status=$?
          set -e
          printf '%s\\n' "$output"
          if ! grep -q 'ALL_PASSED:' <<< "$output"; then
            echo "Shared expenses checks did not reach their expected success marker (psql exit: $status)."
            exit 1
          fi

      - name: Run deadline integrity tests
        shell: bash
        run: |
          set +e
          output=$(docker exec -i "$SUPABASE_DB_CONTAINER" psql --username postgres --dbname postgres --set ON_ERROR_STOP=0 < supabase/tests/deadlines.sql 2>&1)
          status=$?
          set -e
          printf '%s\\n' "$output"
          if ! grep -q 'ALL_PASSED:' <<< "$output"; then
            echo "Deadline checks did not reach their expected success marker (psql exit: $status)."
            exit 1
          fi

      - name: Run recurring item integrity tests
        shell: bash
        run: |
          set +e
          output=$(docker exec -i "$SUPABASE_DB_CONTAINER" psql --username postgres --dbname postgres --set ON_ERROR_STOP=0 < supabase/tests/recurring_items.sql 2>&1)
          status=$?
          set -e
          printf '%s\\n' "$output"
          if ! grep -q 'ALL_PASSED:' <<< "$output"; then
            echo "Recurring item checks did not reach their expected success marker (psql exit: $status)."
            exit 1
          fi

      - name: Run investment and debt integrity and isolation tests
        shell: bash
        run: |
          set +e
          output=$(docker exec -i "$SUPABASE_DB_CONTAINER" psql --username postgres --dbname postgres --set ON_ERROR_STOP=0 < supabase/tests/investments_debts.sql 2>&1)
          status=$?
          set -e
          printf '%s\\n' "$output"
          if ! grep -q 'ALL_PASSED:' <<< "$output"; then
            echo "Investment/debt checks did not reach their expected success marker (psql exit: $status)."
            exit 1
          fi

      - name: Run concurrent write and archival tests
        run: bash supabase/tests/concurrency.sh
