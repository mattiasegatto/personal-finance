name: Encrypted database backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export, encrypt and verify backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Validate backup configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_DB_URL AGE_RECIPIENT CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID R2_BUCKET_NAME; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub secret or variable: $name"
              exit 1
            fi
          done
          if [[ "$AGE_RECIPIENT" != age1* ]]; then
            echo "::error::AGE_RECIPIENT is not a valid age public recipient."
            exit 1
          fi

      - name: Create encrypted backup
        run: bash scripts/create-database-backup.sh "$RUNNER_TEMP/pf-backup"

      - name: Upload backup to EU R2
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          object_key="backups/daily/personal-finance-${timestamp}.tar.gz.age"
          echo "BACKUP_OBJECT_KEY=$object_key" >> "$GITHUB_ENV"
          bunx wrangler r2 object put "$R2_BUCKET_NAME/$object_key" \
            --file="$RUNNER_TEMP/pf-backup/backup.tar.gz.age" \
            --remote \
            --jurisdiction eu

      - name: Download and verify uploaded object
        shell: bash
        run: |
          set -euo pipefail
          bunx wrangler r2 object get "$R2_BUCKET_NAME/$BACKUP_OBJECT_KEY" \
            --file="$RUNNER_TEMP/pf-backup/roundtrip.age" \
            --remote \
            --jurisdiction eu
          cmp "$RUNNER_TEMP/pf-backup/backup.tar.gz.age" "$RUNNER_TEMP/pf-backup/roundtrip.age"
          echo "Backup upload verified byte-for-byte: $BACKUP_OBJECT_KEY"

      - name: Remove temporary plaintext and encrypted files
        if: always()
        run: rm -rf "$RUNNER_TEMP/pf-backup"
